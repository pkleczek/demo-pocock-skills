name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gradle check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The hosted Ubuntu runner provides Docker for jOOQ generation and tests.
      - name: Run checks
        run: ./gradlew check --no-daemon --stacktrace

      - name: Verify coverage report
        run: test -f build/reports/jacoco/test/html/index.html

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/test-results/test/*.xml
            build/reports/tests/test/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        id: coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/
          retention-days: 7
          if-no-files-found: ignore

      - name: Link coverage report
        if: ${{ !cancelled() && steps.coverage.outputs.artifact-url != '' }}
        env:
          COVERAGE_URL: ${{ steps.coverage.outputs.artifact-url }}
        run: echo "[Download HTML coverage report]($COVERAGE_URL) — extract and open index.html." >> "$GITHUB_STEP_SUMMARY"
